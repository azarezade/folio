[workspace]
resolver = "3"
members = ["crates/*", "app/src-tauri"]
# Fuzzing has its own workspace and needs nightly: `cargo +nightly fuzz run <target>` in fuzz/.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"
publish = false

[workspace.dependencies]
folio-ion = { path = "crates/ion" }
folio-kdf = { path = "crates/kdf" }
folio-nmdl = { path = "crates/nmdl" }
folio-render = { path = "crates/render" }
folio-pdfout = { path = "crates/pdfout" }
folio-kfx = { path = "crates/kfx" }
folio-device = { path = "crates/device" }
folio-library = { path = "crates/library" }
folio-core = { path = "crates/core" }

# Third-party, pinned exactly. Checked 2026-10-23 (lopdf 2026-10-24).
blake3 = "=1.8.7"
clap = { version = "=4.6.7", features = ["derive"] }
flate2 = "=1.1.10"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "blob"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
thiserror = "=2.0.21"
tiny-skia = { version = "=0.12.0", default-features = false, features = ["std", "simd"] }
png = "=0.18.1"
libc = "=0.2.191"
mtp-rs = "=0.34.1"
tokio = { version = "=1.54.1", features = ["rt", "time"] }
futures = "=0.3.34"
bytes = "=1.12.1"
tiny_http = "=0.12.0"
lopdf = { version = "=0.45.0", default-features = false }
tauri = { version = "=2.12.5", features = [] }
tauri-build = { version = "=2.7.4", features = [] }
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-opener = "=2.7.2"
tauri-plugin-window-state = "=2.5.0"

[profile.release]
lto = "thin"
codegen-units = 1

# Test builds decode real notebooks; keep them fast.
[profile.dev.package."*"]
opt-level = 2
